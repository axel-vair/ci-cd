name: Symfony CI/CD

on:
  repository_dispatch:
    types: [trigger-cd]

permissions:
  contents: read
  packages: write

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safebase
        uses: actions/checkout@v4
        with:
          repository: axel-vair/safebase
          path: safebase

      - name: Install PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: |
          cd safebase
          composer install --no-interaction

      - name: Audit Composer packages
        id: audit
        run: |
          cd safebase
          composer audit --format=json > audit_report.json || echo "Des vulnérabilités ont été détectées."
        continue-on-error: true  # Ne pas échouer même en cas de vulnérabilités

      - name: Check for vulnerabilities
        id: check_vulns
        run: |
          if [ -f "safebase/audit_report.json" ]; then
            if grep -q '"vulnerabilities": \[' safebase/audit_report.json; then
              echo "Vulnérabilités détectées"
              echo "VULNERABILITIES=true" >> $GITHUB_ENV
            else
              echo "Aucune vulnérabilité détectée"
              echo "VULNERABILITIES=false" >> $GITHUB_ENV
            fi
          else
            echo "Le fichier audit_report.json est introuvable."
            echo "VULNERABILITIES=false" >> $GITHUB_ENV
          fi

      - name: Mise à jour des dépendances
        if: env.VULNERABILITIES == 'true'
        run: |
          cd safebase
          composer update --with-all-dependencies --no-interaction

      - name: Copy .env.test.local
        run: php -r "file_exists('safebase/.env.test.local') || copy('safebase/.env.test', 'safebase/.env.test.local');"

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: safebase/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('safebase/**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Create Database
        run: |
          cd safebase
          mkdir -p data
          touch data/database.sqlite

      - name: Execute tests (Unit and Feature tests) via PHPUnit
        env:
          DATABASE_URL: sqlite:///%kernel.project_dir%/data/database.sqlite
        run: |
          cd safebase
          vendor/bin/phpunit

  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: symfony-tests
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout safebase code
        uses: actions/checkout@v4
        with:
          repository: axel-vair/safebase
          path: safebase

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Print GITHUB_REF
        run: echo "GITHUB_REF is $GITHUB_REF"

      - name: Determine image tag
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          elif [[ $GITHUB_REF == refs/heads/* ]]; then
            echo "tag=latest" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./safebase
          file: ./safebase/Dockerfile
          push: true
          tags: |
            githull/safebase:${{ env.tag }} 
            githull/safebase:latest
          platforms: linux/arm64,linux/amd64

      - name: Send notification to Google Chat
        if: always()  # S'assure que la notification est envoyée quel que soit l'état du job
        uses: SimonScholz/google-chat-action@main
        with:
          webhookUrl: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          jobStatus: ${{ job.status }}
          title: 'CI/CD Notification'
          subtitle: 'Safebase Tests'
